[project]
name = "fmri-timescales"
version = "0.0.1"
description = "Estimating fMRI Timescale Maps"
authors = [{name = "Gabriel Riegner", email = "gariegner@ucsd.edu"}]
dependencies = ["matplotlib==3.9.4", "nilearn==0.11.1", "statsmodels==0.14.1", "notebook", "hcp_utils"]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "ruff"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes (flake8's defaults)
    "I",             # isort
    "UP",            # pyupgrade
    "NPY",           # numpy
    "RUF",           # ruff
    "SIM",           # flake8 simplify
    "C4",            # flake8 comprehensions
    "B",             # flake8 bugbear
    "N",             # naming
]
ignore = ["B905", "N803", "N806", "F401", "N802"]

[tool.ruff.lint.per-file-ignores]
"fmri_timescales/timescale_utils.py" = ["E501"]
